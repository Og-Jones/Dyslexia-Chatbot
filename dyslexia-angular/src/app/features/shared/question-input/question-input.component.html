<section class="question-section">
    <label for="question">
        Your question
    </label>

    <form
        class="question-composer"
        (ngSubmit)="submitQuestion()"
    >
        <textarea
            #questionTextarea
            id="question"
            name="question"
            [(ngModel)]="question"
            placeholder="Ask a question about dyslexia..."
            rows="1"
            [disabled]="disabled"
            (input)="resizeTextarea($event)"
            (keydown.enter)="handleEnter($event)"
        ></textarea>

        <button
            type="submit"
            [disabled]="
                disabled ||
                !question.trim()
            "
            aria-label="Ask question"
        >
            <span>Ask</span>

            <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
            >
                <path
                    d="M4 12h15M13 6l6 6-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>
    </form>

    <p class="keyboard-hint">
        Press Enter to ask or Shift + Enter for a new line
    </p>
</section>
