<main class="chatbot">
    <header class="page-header">
        <h1>Dyslexia Assistant</h1>

        <p>
            Ask a question about dyslexia
        </p>
    </header>

    <app-question-input
        [disabled]="isLoadingAnswer"
        (questionSubmitted)="askQuestion($event)"
    />

    @if (isLoadingAnswer) {
        <div
            class="status-message"
            role="status"
            aria-live="polite"
        >
            Finding information and preparing your answer...
        </div>
    }

    @if (errorMessage) {
        <div
            class="error-message"
            role="alert"
        >
            {{ errorMessage }}
        </div>
    }

    @if (response; as currentResponse) {
        <app-answer-card
            [response]="currentResponse"
            [audioUrl]="audioUrl"
            [isLoadingAudio]="isLoadingAudio"
        ></app-answer-card>
    }
</main>
