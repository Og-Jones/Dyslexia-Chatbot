<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dyslexia Knowledge Bot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <header>
            <h1>Dyslexia Knowledge Bot</h1>
            <p>Ask a question about dyslexia and get an answer based on trusted sources.</p>
        </header>

        <section class="question">
            <textarea
                id="question"
                placeholder="Ask a question..."
                aria-label="Your question"
            ></textarea>

            <button id="ask-button">
                Ask
            </button>
        </section>

        <div id="loading" hidden>
            Thinking...
        </div>

        <div id="error" hidden></div>

        <section id="result" hidden>

            <div class="answer-section">
                <h2>Answer</h2>
                <p id="answer"></p>
            </div>

            <div class="sources-section">
                <h2>Sources</h2>
                <div id="sources"></div>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
